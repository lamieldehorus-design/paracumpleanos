name: Deploy a GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache de npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Construir sitio (ejecuta el validador de titulos en prebuild)
        run: npm run build
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Guardar sitemap para IndexNow
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-xml
          path: dist/sitemap.xml
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Descargar sitemap construido
        uses: actions/download-artifact@v4
        with:
          name: sitemap-xml
          path: dist
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Notificar todas las URLs a Bing IndexNow
        continue-on-error: true
        run: node scripts/enviar-indexnow.mjs --wait-key=60

  google-notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Notificar actualizacion a Google (WebSub + Search Console API)
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/notificar-google.mjs --wait-live=60
