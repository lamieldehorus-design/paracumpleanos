name: Deploy ParaCumpleanos.com to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js robots.txt sitemap.xml CNAME BingSiteAuth.xml google939990971c7be018.html indexnow-key.txt .nojekyll _site/
          cp -R mensajes-de-cumpleanos frases-de-cumpleanos postales-de-cumpleanos publicaciones _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
